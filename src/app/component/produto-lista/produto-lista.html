<section class="catalogo">
    <header class="catalogo-cabecalho">
        <div>
            <p class="eyebrow">Catálogo</p>
            <h1>{{ tituloPagina }}</h1>
        </div>

        <div class="catalogo-acoes">
            <ng-container *ngIf="categoriaSelecionada">
                <button class="voltar-inicio" type="button" (click)="voltarParaInicio()" aria-label="Voltar para a página inicial">
                    ← Página inicial
                </button>
            </ng-container>
            <a class="wishlist" href="/favoritos">Wishlist</a>
            <a class="favoritos-menu" href="/favoritos/todos">Favoritos</a>
            <label for="categoria">Filtrar por categoria</label>
            <select
                id="categoria"
                [ngModel]="categoriaSelecionada"
                (ngModelChange)="alterarCategoria($event)"
            >
                <option value="">Todas as categorias</option>
                <option *ngFor="let categoria of categorias" [value]="categoria">
                    {{ categoria }}
                </option>
            </select>
        </div>
    </header>

    <ng-container *ngIf="carregando(); else resultadoTemplate">
        <p class="resultado">Carregando produtos...</p>
    </ng-container>

    <ng-template #resultadoTemplate>
        <p *ngIf="erro(); else produtosOk" class="erro">Não foi possível carregar os produtos. Atualize a página e tente novamente.</p>

        <ng-template #produtosOk>
            <p class="resultado">
                {{ produtosFiltrados.length }} produto(s) encontrado(s)
            </p>
        </ng-template>
    </ng-template>

    <div class="grade-produtos" *ngIf="!carregando() && !erro()">
        <article class="produto-card" *ngFor="let produto of produtosFiltrados">
            <div class="produto-imagem">
                <img [src]="produto.image" [alt]="produto.title" />
            </div>
            <div class="produto-conteudo">
                <p class="categoria">{{ produto.category }}</p>
                <h2>{{ produto.title }}</h2>
                <p class="preco">{{ produto.price | currency:'BRL' }}</p>
                <label class="prioridade-label" [for]="'prioridade-' + produto.id">
                    Prioridade
                    <select
                        [id]="'prioridade-' + produto.id"
                        [ngModel]="obterPrioridade(produto.id)"
                        (ngModelChange)="definirPrioridade(produto.id, $event)"
                        [disabled]="foiWishlist(produto.id)"
                    >
                        <option *ngFor="let prioridade of prioridades" [value]="prioridade">
                            {{ prioridade }}
                        </option>
                    </select>
                </label>

                <ng-container *ngIf="categoriaSelecionada">
                    <label class="interesse-label">
                        <span class="interesse-checkbox">
                            <input
                                type="checkbox"
                                [name]="'interesse-' + produto.id"
                                [checked]="temInteresse(produto.id)"
                                (change)="alternarInteresse(produto.id, $any($event.target).checked)"
                            />
                            <span>Tenho interesse</span>
                        </span>
                    </label>

                    <ng-container *ngIf="temInteresse(produto.id)">
                        <label class="observacao-label" [for]="'observacao-' + produto.id">
                            Observação
                            <textarea
                                [id]="'observacao-' + produto.id"
                                [name]="'observacao-' + produto.id"
                                rows="1"
                                [ngModel]="observacoesInteresse[produto.id] || ''"
                                (ngModelChange)="atualizarObservacaoInteresse(produto.id, $event)"
                                placeholder="fale mais sobre seu interesse..."
                            ></textarea>
                        </label>
                    </ng-container>
                </ng-container>

                <div class="produto-acoes">
                    <button
                        class="favoritar"
                        type="button"
                        (click)="alternarWishlist(produto)"
                        [attr.aria-label]="(foiWishlist(produto.id) ? 'Remover ' : 'Adicionar ') + produto.title + ' ' + (foiWishlist(produto.id) ? 'da' : 'à') + ' wishlist'"
                    >
                        {{ foiWishlist(produto.id) ? 'Remover da wishlist' : 'Wishlist' }}
                    </button>
                    <ng-container *ngIf="foiFavorito(produto.id); else favoritoOff">
                        <button
                            class="favorito-detalhe favorito-adicionado"
                            type="button"
                            (click)="removerFavorito(produto)"
                            [attr.aria-label]="'Retirar ' + produto.title + ' dos favoritos'"
                        >
                            Retirar dos favoritos
                        </button>
                    </ng-container>
                    <ng-template #favoritoOff>
                        <button
                            class="favorito-detalhe"
                            type="button"
                            (click)="abrirFormularioFavorito(produto)"
                            [attr.aria-label]="'Adicionar ' + produto.title + ' aos favoritos'"
                        >
                            Favorito
                        </button>
                    </ng-template>
                </div>
            </div>
        </article>
    </div>
</section>
