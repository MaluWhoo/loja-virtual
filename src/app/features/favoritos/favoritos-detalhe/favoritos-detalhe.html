<main class="favorito-detalhe">
	<button class="voltar" type="button" (click)="voltarParaInicio()" aria-label="Voltar para a página inicial">
		← Página inicial
	</button>

	<ng-container *ngIf="produto() as produtoAtual; else carregandoProduto">
		<section class="produto-resumo">
			<img *ngIf="produtoAtual.image" [src]="produtoAtual.image" [alt]="produtoAtual.title" />
			<div>
				<p class="eyebrow">Adicionar aos favoritos</p>
				<h1>{{ produtoAtual.title }}</h1>
				<p class="preco">{{ produtoAtual.price | currency:'BRL' }}</p>
			</div>
		</section>

		<form [formGroup]="form" (ngSubmit)="favoritar()" novalidate>
			<label for="motivo">Por que você gostou deste produto?</label>
			<textarea
				id="motivo"
				formControlName="motivo"
				rows="2"
				placeholder="Ex.: Adorei a peça..."
			></textarea>
			<small *ngIf="enviado && form.controls['motivo'].invalid">Escreva pelo menos 5 caracteres.</small>
			<button type="submit">Salvar favorito</button>
			<p *ngIf="salvo" class="sucesso" role="status">Favorito salvo com sucesso.</p>
		</form>
	</ng-container>

	<ng-template #carregandoProduto>
		<p>Carregando produto...</p>
	</ng-template>
</main>
